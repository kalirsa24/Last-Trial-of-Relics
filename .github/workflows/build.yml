name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # GitHub release CDN иногда отдаёт 5xx на gradle-<version>-bin.zip.
      # Тогда собираем предустановленным в образ Gradle — код от этого не меняется.
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          if ./gradlew --version > /dev/null 2>&1; then
            echo "Using Gradle wrapper"
            ./gradlew build --no-daemon --stacktrace
          else
            echo "::warning::Gradle wrapper download failed, falling back to preinstalled Gradle"
            gradle --version
            gradle build --no-daemon --stacktrace
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: last-trial-of-relics
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
