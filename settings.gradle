pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Автоматически скачивает JDK 17, если его нет в системе:
	// сборка не зависит от локальных путей и JAVA_HOME.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Last-Trial-of-Relics'
